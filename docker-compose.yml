services:
  pdf-mcp-server:
    build: .
    container_name: pdf-mcp-server
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Use a bind mount if HOST_STORAGE_DIR is set, otherwise fallback to named volume
      - ${HOST_STORAGE_DIR:-pdf-data}:/data/pdfs
    restart: unless-stopped

volumes:
  pdf-data:



